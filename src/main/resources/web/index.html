<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NextNodes — Panel de Permisos</title>
  <script>try{document.documentElement.setAttribute('data-theme', localStorage.getItem('nn_theme')||'light');}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/web/styles.css">
</head>
<body>

  <!-- ░░ AMBIENT BACKDROP ░░ -->
  <div class="bg-canvas" aria-hidden="true">
    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>
    <div class="bg-grid"></div>
  </div>

  <!-- ░░ LOGIN ░░ -->
  <div id="login" class="login">
    <div class="loginBox">
      <div class="loginGlow"></div>
      <div class="login-brand">
        <div class="logoMark">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="12" cy="18" r="3"/>
            <line x1="8.5" y1="7.5" x2="15.5" y2="7.5"/><line x1="7" y1="8.5" x2="11" y2="15.5"/><line x1="17" y1="8.5" x2="13" y2="15.5"/>
          </svg>
        </div>
        <div>
          <h1 class="login-title">NextNodes</h1>
          <p class="login-sub">Panel de administración de permisos</p>
        </div>
      </div>
      <div class="login-sep"></div>
      <label class="login-field-label">
        Contraseña de sesión
        <div class="login-input-wrap">
          <svg class="login-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input id="password" type="password" class="login-input" placeholder="Introduce la contraseña…" autocomplete="current-password" onkeydown="if(event.key==='Enter') login()">
        </div>
      </label>
      <button class="login-btn primary" onclick="login()">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
        Acceder al panel
      </button>
      <div id="loginError" class="login-error"></div>
    </div>
  </div>

  <!-- ░░ APP ░░ -->
  <div id="app" class="app hidden">

    <!-- Top bar -->
    <header class="topbar">
      <div class="brand">
        <div class="logoMark">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="6" cy="6" r="2.6"/><circle cx="18" cy="6" r="2.6"/><circle cx="12" cy="18" r="2.6"/>
            <line x1="8.4" y1="7.2" x2="15.6" y2="7.2"/><line x1="7" y1="8.4" x2="11" y2="15.6"/><line x1="17" y1="8.4" x2="13" y2="15.6"/>
          </svg>
        </div>
        <span class="brandName">NextNodes</span>
        <span class="brandTag">Permisos</span>
      </div>

      <nav class="nav">
        <button id="tabOverview" class="active" onclick="showTab('overview')">Resumen</button>
        <button id="tabUsers" onclick="showTab('users')">Jugadores<span class="navCount" id="navUsers">0</span></button>
        <button id="tabRanks" onclick="showTab('ranks')">Rangos<span class="navCount" id="navRanks">0</span></button>
        <button id="tabCommands" onclick="showTab('commands')">Comandos<span class="navCount" id="navCommands">0</span></button>
        <button id="tabBans" onclick="showTab('bans')">Baneos<span class="navCount" id="navBans">0</span></button>
      </nav>

      <div class="topRight">
        <div class="sessionInfo" id="sessionInfo" style="display:none">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <div class="sessionBar"><div class="sessionBarFill" id="sessionBarFill"></div></div>
          <span class="sessionText" id="sessionText"></span>
        </div>
        <button class="iconBtn" id="themeBtn" onclick="toggleTheme()" title="Cambiar tema"></button>
        <button class="iconBtn" onclick="load()" title="Actualizar">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
        </button>
        <div class="statusPill"><span class="onlineDot on"></span><span class="statusText" id="status">Conectando…</span></div>
      </div>
    </header>

    <!-- Content -->
    <main class="content">
      <div class="pageHead">
        <div>
          <h1 id="pageTitle">Resumen</h1>
          <p class="muted" id="pageHint">Control general del servidor.</p>
        </div>
      </div>
      <section id="overviewView"  class="stack"></section>
      <section id="usersView"    class="stack hidden"></section>
      <section id="ranksView"    class="stack hidden"></section>
      <section id="commandsView" class="stack hidden"></section>
      <section id="bansView"     class="stack hidden"></section>
    </main>

  </div><!-- /#app -->

  <script src="/web/app.js"></script>
</body>
</html>
